<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Hello WebXR!</title>
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
</head>
<body>
  <button onclick="activateXR()">Start Hello WebXR</button>
  <script>
    let scene, renderer, camera, cube;
    let xrSession = null;

    async function activateXR() {
      // Crear canvas y contexto WebGL
      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});
      
      // Inicializar Three.js
      scene = new THREE.Scene();
      
      // Materiales para el cubo (un color por cada cara)
      const materials = [
        new THREE.MeshBasicMaterial({color: 0xff0000}),
        new THREE.MeshBasicMaterial({color: 0x0000ff}),
        new THREE.MeshBasicMaterial({color: 0x00ff00}),
        new THREE.MeshBasicMaterial({color: 0xff00ff}),
        new THREE.MeshBasicMaterial({color: 0x00ffff}),
        new THREE.MeshBasicMaterial({color: 0xffff00})
      ];
      
      // Crear el cubo
      cube = new THREE.Mesh(new THREE.BoxBufferGeometry(0.2, 0.2, 0.2), materials);
      scene.add(cube);
      
      // Configurar renderizador
      renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;
      
      // Configurar cámara
      camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;
      
      try {
        // Solicitar sesión AR
        xrSession = await navigator.xr.requestSession("immersive-ar");
        
        // Configurar capa de renderizado
        await xrSession.updateRenderState({
          baseLayer: new XRWebGLLayer(xrSession, gl)
        });
        
        // Espacio de referencia
        const referenceSpace = await xrSession.requestReferenceSpace('local');
        
        // Iniciar bucle de renderizado
        xrSession.requestAnimationFrame(onXRFrame);
      } catch (error) {
        console.error("Error al iniciar AR:", error);
        alert("No se pudo iniciar AR: " + error.message);
      }
    }

    function onXRFrame(time, frame) {
      if (!xrSession) return;
      
      // Solicitar siguiente frame
      xrSession.requestAnimationFrame(onXRFrame);
      
      // Obtener pose del dispositivo
      const pose = frame.getViewerPose(frame.session.renderState.baseLayer.space);
      if (pose) {
        const view = pose.views[0];
        
        // Configurar viewport
        const viewport = xrSession.renderState.baseLayer.getViewport(view);
        renderer.setSize(viewport.width, viewport.height);
        
        // Actualizar cámara
        camera.matrix.fromArray(view.transform.matrix);
        camera.projectionMatrix.fromArray(view.projectionMatrix);
        camera.updateMatrixWorld(true);
        
        // Renderizar escena
        renderer.clear();
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>

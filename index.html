<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" 
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>WebXR Hit Test con Girasol</title>
  
  <!-- three.js -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <button onclick="activateXR()">Iniciar Realidad Aumentada</button>
  <div id="loading">Cargando modelos...</div>
  
  <script>
    let scene, renderer, camera;
    let reticle, flower;
    let hitTestSource;
    let xrSession = null;
    let modelsLoaded = 0;

    async function activateXR() {
      // Ocultar botón y mostrar mensaje de carga
      document.querySelector('button').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      // Crear canvas y contexto WebGL
      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});

      // Verificar compatibilidad con WebXR
      if (!navigator.xr) {
        alert("Tu navegador no soporta WebXR");
        return;
      }

      // Inicializar Three.js
      scene = new THREE.Scene();

      // Añadir iluminación
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight.position.set(10, 15, 10);
      scene.add(directionalLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      // Configurar renderizador
      renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;
      
      // Configurar cámara
      camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Cargar modelos GLTF
      const loader = new THREE.GLTFLoader();
      
      // Cargar retícula
      loader.load(
        "https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", 
        function(gltf) {
          reticle = gltf.scene;
          reticle.visible = false;
          scene.add(reticle);
          modelLoaded();
        },
        undefined,
        function(error) {
          console.error("Error al cargar la retícula:", error);
        }
      );

      // Cargar girasol
      loader.load(
        "https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", 
        function(gltf) {
          flower = gltf.scene;
          modelLoaded();
        },
        undefined,
        function(error) {
          console.error("Error al cargar el girasol:", error);
        }
      );

      function modelLoaded() {
        modelsLoaded++;
        if (modelsLoaded === 2) {
          document.getElementById('loading').style.display = 'none';
          initializeXR();
        }
      }

      async function initializeXR() {
        try {
          // Iniciar sesión AR con soporte para hit-test
          xrSession = await navigator.xr.requestSession("immersive-ar", {
            requiredFeatures: ['hit-test']
          });

          // Configurar capa de renderizado
          await xrSession.updateRenderState({
            baseLayer: new XRWebGLLayer(xrSession, gl)
          });

          // Obtener espacios de referencia
          const referenceSpace = await xrSession.requestReferenceSpace('local');
          const viewerSpace = await xrSession.requestReferenceSpace('viewer');
          
          // Crear fuente para hit-test
          hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

          // Configurar evento para toques en pantalla
          xrSession.addEventListener("select", (event) => {
            if (flower && reticle.visible) {
              const clone = flower.clone();
              clone.position.copy(reticle.position);
              scene.add(clone);
            }
          });

          // Bucle de renderizado
          const onXRFrame = (time, frame) => {
            xrSession.requestAnimationFrame(onXRFrame);

            gl.bindFramebuffer(gl.FRAMEBUFFER, xrSession.renderState.baseLayer.framebuffer);

            const pose = frame.getViewerPose(referenceSpace);
            if (pose) {
              const view = pose.views[0];

              const viewport = xrSession.renderState.baseLayer.getViewport(view);
              renderer.setSize(viewport.width, viewport.height);

              camera.matrix.fromArray(view.transform.matrix);
              camera.projectionMatrix.fromArray(view.projectionMatrix);
              camera.updateMatrixWorld(true);

              // Realizar hit-test
              if (hitTestSource) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);
                if (hitTestResults.length > 0 && reticle) {
                  const hitPose = hitTestResults[0].getPose(referenceSpace);
                  reticle.visible = true;
                  reticle.position.set(
                    hitPose.transform.position.x, 
                    hitPose.transform.position.y, 
                    hitPose.transform.position.z
                  );
                  reticle.updateMatrixWorld(true);
                } else {
                  reticle.visible = false;
                }
              }

              renderer.render(scene, camera);
            }
          };

          xrSession.requestAnimationFrame(onXRFrame);

        } catch (error) {
          console.error("Error al iniciar WebXR:", error);
          alert("Error: " + error.message);
        }
      }
    }
  </script>
</body>
</html>

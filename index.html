<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>AR con WebXR</title>
  
  <!-- three.js -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <button onclick="activateXR()">Iniciar Realidad Aumentada</button>
  
  <script>
    async function activateXR() {
      // Crear canvas y contexto WebGL
      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});
      
      // Crear escena Three.js
      const scene = new THREE.Scene();
      
      // Configurar iluminación
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight.position.set(10, 15, 10);
      scene.add(directionalLight);
      
      // Configurar renderizador
      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;
      
      // Configurar cámara
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;
      
      try {
        // Iniciar sesión WebXR
        const session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ['hit-test']
        });
        session.updateRenderState({
          baseLayer: new XRWebGLLayer(session, gl)
        });
        
        // Espacios de referencia
        const referenceSpace = await session.requestReferenceSpace('local');
        const viewerSpace = await session.requestReferenceSpace('viewer');
        const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        
        // Cargar modelos 3D
        const loader = new THREE.GLTFLoader();
        
        // Cargar retícula (marcador de posición)
        let reticle;
        loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", function(gltf) {
          reticle = gltf.scene;
          reticle.visible = false;
          scene.add(reticle);
        }, undefined, function(error) {
          console.error("Error al cargar la retícula:", error);
        });
        
        // Cargar modelo de flor
        let flower;
        loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", function(gltf) {
          flower = gltf.scene;
        }, undefined, function(error) {
          console.error("Error al cargar la flor:", error);
        });
        
        // Evento para colocar flores
        session.addEventListener("select", (event) => {
          if (flower && reticle && reticle.visible) {
            const clone = flower.clone();
            clone.position.copy(reticle.position);
            scene.add(clone);
          }
        });
        
        // Bucle de renderizado
        const onXRFrame = (time, frame) => {
          session.requestAnimationFrame(onXRFrame);
          
          gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
          
          // Obtener la posición del dispositivo
          const pose = frame.getViewerPose(referenceSpace);
          if (pose) {
            // En AR móvil solo tenemos una vista
            const view = pose.views[0];
            
            // Configurar viewport
            const viewport = session.renderState.baseLayer.getViewport(view);
            renderer.setSize(viewport.width, viewport.height);
            
            // Actualizar cámara
            camera.matrix.fromArray(view.transform.matrix);
            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.updateMatrixWorld(true);
            
            // Realizar prueba de impacto (hit-test)
            if (hitTestSource) {
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              if (hitTestResults.length > 0 && reticle) {
                const hitPose = hitTestResults[0].getPose(referenceSpace);
                reticle.visible = true;
                reticle.position.set(
                  hitPose.transform.position.x, 
                  hitPose.transform.position.y, 
                  hitPose.transform.position.z
                );
                reticle.updateMatrixWorld(true);
              } else if (reticle) {
                reticle.visible = false;
              }
            }
            
            // Renderizar escena
            renderer.render(scene, camera);
          }
        };
        
        // Iniciar bucle de renderizado
        session.requestAnimationFrame(onXRFrame);
        
      } catch (error) {
        console.error("Error al iniciar WebXR:", error);
        alert("No se pudo iniciar la realidad aumentada. Asegúrate de usar un dispositivo compatible.");
      }
    }
    
    // Verificar compatibilidad con WebXR
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then((supported) => {
          if (!supported) {
            document.querySelector('button').disabled = true;
            alert("La realidad aumentada no está soportada en tu dispositivo.");
          }
        });
    } else {
      document.querySelector('button').disabled = true;
      alert("Tu navegador no soporta WebXR. Prueba con Chrome en Android.");
    }
  </script>
</body>
</html>
